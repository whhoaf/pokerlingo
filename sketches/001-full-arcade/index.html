:root{--red:#FE5F55;--red-d:#b8453d;--blue:#009DFF;--blue-d:#0070b5;--orange:#FDA200;--orange-d:#b87600;
  --green:#4BC292;--gold:#EAC058;--purple:#8867A5;--black:#374244;--lblack:#4F6367;--grey:#5F7377;--jgrey:#BFC7D5;
  --sp:#374244;--ht:#FE5F55;--di:#009DFF;--cl:#3a9a76;--px:"m6x11plus",monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1b3a33;color:#fff;font-family:var(--px);font-size:18px;line-height:1.25;overflow:hidden;
  -webkit-font-smoothing:none;font-smooth:never;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.screen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;gap:12px;
  padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 16px)}
.panel{background:rgba(55,66,68,.94);border:2px solid var(--lblack);border-radius:var(--rad);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.hud{display:flex;gap:10px;align-items:stretch}
.timer{flex:0 0 auto;padding:6px 12px 8px;display:flex;flex-direction:column;justify-content:center}
.lbl{font-family:var(--px);font-size:18px;color:var(--jgrey);letter-spacing:1px}
.timer .val{font-size:54px;line-height:.9;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.tag{flex:1;display:flex;flex-direction:column;justify-content:center;padding:6px 12px;background:var(--purple);border-color:#a184bb}
.tag b{font-weight:normal;font-size:36px;line-height:1}
.btn{font-family:var(--px);color:#fff;border:0;border-radius:var(--rad);cursor:pointer;
  text-shadow:0 3px 0 rgba(0,0,0,.25);box-shadow:0 6px 0 var(--sh);transition:transform 60ms,box-shadow 60ms;
  -webkit-font-smoothing:none}
.btn:active,.btn.pressed{transform:translateY(6px);box-shadow:0 0 0 var(--sh)}
.btn.big{width:100%;font-size:36px;padding:12px 0 14px}
.btn.small{font-size:18px;padding:0 14px}
.blue{background:var(--blue);--sh:var(--blue-d)} .red{background:var(--red);--sh:var(--red-d)} .orange{background:var(--orange);--sh:var(--orange-d)}
.felt{padding:10px 12px 12px;background:rgba(0,0,0,.28);border-radius:var(--rad);box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
.row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.note{margin-top:10px;text-align:center;color:var(--gold)}
.card{position:relative;background:#fbfaf3;border-radius:var(--crad);border:2px solid #e3dfd2;
  box-shadow:0 6px 0 rgba(0,0,0,.38);transform:rotate(var(--r));animation:deal .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
.card.sm{width:62px;height:86px}.card.lg{width:84px;height:116px}
.card .rk{position:absolute;left:6px;top:3px;font-size:36px;line-height:1}
.card.sm .rk{font-size:36px}
.card .pip{position:absolute;left:7px;top:38px;width:18px;height:18px}
.card .big{position:absolute;right:8px;bottom:8px;width:27px;height:27px}
.card.lg .big{width:45px;height:45px;right:9px;bottom:10px}.card.lg .pip{top:40px}
.card.sm .pip{display:none}
.s-s{color:var(--sp)}.s-h{color:var(--ht)}.s-d{color:var(--di)}.s-c{color:var(--cl)}
.card svg{fill:currentColor;display:block}
@keyframes deal{0%{transform:translateY(-40px) rotate(calc(var(--r) - 12deg));opacity:0}100%{transform:rotate(var(--r));opacity:1}}
.hand .row{gap:4px}.hand .card.lg:first-child{margin-right:-6px}
.prompt{padding:12px 14px 14px;font-size:var(--psize);line-height:var(--plh)}
.answer{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.numfield{display:flex;align-items:baseline;justify-content:center;gap:10px;padding:4px 12px 10px;background:#fbfaf3;color:var(--black);border-color:#e3dfd2}
.numfield .n{font-size:54px;line-height:1}.numfield .u{font-size:36px;color:var(--grey)}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:16px 14px calc(env(safe-area-inset-bottom) + 16px);
  background:#283133;border-top:2px solid var(--lblack);box-shadow:0 -10px 0 rgba(0,0,0,.25);border-radius:var(--rad) var(--rad) 0 0;
  transform:translateY(105%);transition:transform .38s cubic-bezier(.2,1.4,.4,1)}
body.answered .fb{transform:translateY(0)}
.res{display:flex;align-items:center;gap:12px}
.res .ok{font-size:54px;line-height:1;color:var(--green);text-shadow:0 4px 0 rgba(0,0,0,.35)}
.chip{font-size:36px;line-height:1;padding:4px 10px 6px;border-radius:var(--rad);background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
body.answered .chip{animation:pop .5s .25s cubic-bezier(.2,2,.4,1) both}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg)}100%{transform:scale(1) rotate(0)}}
.ansline{margin-top:10px;font-size:36px;color:var(--gold)}
.why{margin-top:6px;font-size:var(--bsize);line-height:var(--blh);color:#e9edf2}
.work{margin:10px 0 16px;padding:10px 12px;border-radius:var(--rad);background:rgba(0,0,0,.25);list-style:none;font-size:var(--bsize);line-height:var(--blh);color:var(--jgrey)}
.work li+li{margin-top:4px}
.credit{position:fixed;right:6px;bottom:2px;font-size:9px;opacity:.0}

:root{--rad:6px;--crad:5px;--psize:36px;--plh:1.0;--bsize:18px;--blh:1.3}
.crt{position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.09) 2px 4px),
  radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%)}
.screen,.fb{text-shadow:0 0 2px rgba(255,255,255,.22)}
.card{animation:deal .5s cubic-bezier(.2,1.6,.4,1) both,wob 3.2s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + 600ms)}
@keyframes wob{0%,100%{transform:rotate(var(--r)) translateY(0)}50%{transform:rotate(calc(var(--r) + 1.8deg)) translateY(-3px)}}
</style></head>
<body class="va">
<canvas id="bg" aria-hidden="true"></canvas>
<div class="crt" aria-hidden="true"></div>
<main class="screen">
  <header class="hud">
    <div class="panel timer"><span class="lbl">TIME</span><span class="val">7:42</span></div>
    <div class="panel tag"><span class="lbl" style="color:#efe3f7">NEW SKILL</span><b>1 of 2</b></div>

<section class="fb" aria-live="polite">
  <div class="res"><span class="ok">Right!</span><span class="chip">+1</span></div>
  <div class="ansline">9 outs</div>
  <p class="why">Any diamond completes your flush.</p>
  <ul class="work"><li>13 diamonds in the deck</li><li>4 are showing: 3 on the board, 1 in your hand</li><li>13 minus 4 leaves 9 outs</li></ul>
  <button class="btn orange big" id="next">Next</button>
</section>
<script>
(() => {
  const SPEED = 1.0, CONTRAST = 1.0;
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  const W = 78, H = 169; cv.width = W; cv.height = H;
  const img = ctx.createImageData(W, H);
  const C = [[24, 58, 51], [42, 106, 88], [63, 143, 116], [20, 44, 40]];
  function frame(ms) {
    const t = ms / 1000 * SPEED;
    let k = 0;
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      let u = (i - W / 2) / H, v = (j - H * 0.45) / H;
      const r = Math.hypot(u, v);
      const a = Math.atan2(v, u) + t * 0.12 - 2.4 * r;
      let x = r * Math.cos(a) * 7, y = r * Math.sin(a) * 7;
      for (let n = 0; n < 4; n++) {
        const nx = x + 0.55 * Math.cos(1.7 + 0.45 * y + t * 0.31);
        const ny = y + 0.55 * Math.sin(0.9 * x - 0.23 * t);
        x = nx - 0.45 * Math.cos(nx + ny); y = ny + 0.45 * Math.sin(nx * 0.7 - ny);
      }
      const f = (Math.hypot(x, y) * 0.16 + 0.04 * Math.sin(t)) % 1;
      let c = f < 0.28 ? C[0] : f < 0.55 ? C[1] : f < 0.74 ? C[2] : C[3];
      if (CONTRAST < 1) c = c.map((ch, z) => Math.round(ch * CONTRAST + C[0][z] * (1 - CONTRAST)));
      img.data[k++] = c[0]; img.data[k++] = c[1]; img.data[k++] = c[2]; img.data[k++] = 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  let last = 0;
  function loop(ms) { if (ms - last > 50) { frame(ms); last = ms; } requestAnimationFrame(loop); }
  frame(0); requestAnimationFrame(loop);
  const check = document.getElementById('check');
  check.addEventListener('click', () => { document.body.classList.add('answered'); });
  document.getElementById('next').addEventListener('click', () => location.reload());
})();
</script>
